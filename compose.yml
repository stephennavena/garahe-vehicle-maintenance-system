# Local self-hosting with Docker Compose (optional).
#
#   cp .env.example .env      # set POSTGRES_PASSWORD and CORS_ORIGINS
#   docker compose up -d
#   docker compose logs -f api

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: garahe
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d garahe']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/garahe
      CORS_ORIGINS: ${CORS_ORIGINS}
      NODE_ENV: production
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  pgdata:
